<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>GPU 현황</title>
<style>
  :root{
    --bg:#f7f7f8; --card:#fff; --ink:#17171c; --muted:#6b6b78; --line:#e3e3e8;
    --used:#e5546b; --free:#2f9e6e; --down:#b9b9c3; --me:#fff4d6; --accent:#3a6ff7;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#111114; --card:#1b1b20; --ink:#ececf1; --muted:#9a9aa8; --line:#2c2c34;
    --used:#f0657c; --free:#3fbf86; --down:#4a4a55; --me:#3a3220; --accent:#7c9cff;
  }}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;}
  .wrap{max-width:1280px;margin:0 auto;padding:24px 16px 64px;}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:20px;}
  h1{font-size:24px;margin:0;}
  #stamp{color:var(--muted);font-variant-numeric:tabular-nums;}
  #stamp.stale{color:var(--used);font-weight:600;}
  h2{font-size:17px;margin:32px 0 12px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .card .t{font-weight:600;}
  .card .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px;}
  .card .n small{font-size:14px;font-weight:400;color:var(--muted);}
  .card .s{color:var(--muted);font-size:13px;}
  .more{margin-top:12px;}
  .more summary{cursor:pointer;color:var(--muted);padding:4px 0;}
  .more .cards{margin-top:8px;}
  .bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin-top:8px;}
  .bar i{display:block;height:100%;}
  .tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;}
  table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums;}
  th,td{padding:7px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--card);cursor:pointer;user-select:none;}
  tr:last-child td{border-bottom:none;}
  tr.me td{background:var(--me);}
  td.mono{font-family:var(--mono);font-size:12px;}
  .gpus{display:inline-flex;gap:3px;vertical-align:middle;}
  .gpus b{width:10px;height:10px;border-radius:2px;background:var(--free);}
  .gpus b.u{background:var(--used);} .gpus b.d{background:var(--down);}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  input,select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;}
  button{cursor:pointer;}
  .hint{color:var(--muted);font-size:13px;}
  [hidden]{display:none!important;}
</style>
</head>
<body>
<div class="wrap">
  <main id="app">
    <header>
      <h1>GPU 현황</h1>
      <span id="stamp">불러오는 중…</span>
      <span class="hint">2분마다 갱신</span>
    </header>

    <h2>GPU 종류별 남은 개수</h2>
    <div class="cards" id="types"></div>
    <details class="more">
      <summary id="otherSum">다른 GPU</summary>
      <div class="cards" id="otherTypes"></div>
    </details>

    <h2>내 잡</h2>
    <div class="tbl-wrap"><table id="mine"></table></div>

    <h2>노드</h2>
    <div class="controls">
      <select id="nodeType"><option value="">모든 GPU</option></select>
      <label class="hint"><input type="checkbox" id="onlyFree"> 빈 GPU 있는 노드만</label>
    </div>
    <div class="tbl-wrap"><table id="nodes"></table></div>

    <h2>전체 잡</h2>
    <div class="controls">
      <input id="q" placeholder="사용자·잡 이름·파티션·노드 검색">
      <select id="jstate"><option value="">전체</option><option value="R">실행 중</option><option value="P">대기</option></select>
    </div>
    <div class="tbl-wrap"><table id="jobs"></table></div>
    <p class="hint" id="jobsMore"></p>
  </main>
</div>

<script>
const ME = 'dkim011006';
// raw CDN 캐시를 다 같이 공유하도록 2분 창마다 같은 주소 (push가 끝난 30초 뒤에 창이 바뀜)
const DATA_URL = () => 'https://raw.githubusercontent.com/daeyeonkr/gpu-monitor/data/data.json.gz?t=' + Math.floor((Date.now() / 1000 - 30) / 120);
let snap = null;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load(){
  const r = await fetch(DATA_URL());
  if (!r.ok) throw new Error('fetch ' + r.status);
  return JSON.parse(await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text());
}

const usable = n => !/DOWN|DRAIN|NOT_RESPONDING|FAIL|MAINT|RESERVED/.test(n.state);
const freeOf = n => usable(n) ? Math.max(0, n.total - n.alloc) : 0;

function renderStamp(){
  if (!snap) return;
  const d = new Date(snap.ts * 1000);
  const ago = Math.round((Date.now() / 1000 - snap.ts) / 60);
  const t = d.toLocaleString('ko-KR', {timeZone:'Asia/Seoul', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
  $('stamp').textContent = `${t} 기준 (${ago < 1 ? '방금' : ago + '분 전'})`;
  $('stamp').classList.toggle('stale', ago >= 10);
}

function renderTypes(){
  const by = {};
  for (const n of snap.nodes){
    const g = by[n.gpu] ||= {total:0, used:0, down:0, free:0, nodes:0};
    g.total += n.total; g.nodes++;
    if (usable(n)){ g.used += Math.min(n.alloc, n.total); g.free += freeOf(n); }
    else g.down += n.total;
  }
  // 주로 쓰는 A100 80GB, H200, A100 40GB 순으로 앞에, 나머지는 토글 안에
  const rank = k => /^A100.*80GB/.test(k) ? 0 : /^H200/.test(k) ? 1 : /^A100.*40GB/.test(k) ? 2 : 3;
  const rows = Object.entries(by).sort((a, b) => rank(a[0]) - rank(b[0]) || b[1].free - a[1].free || a[0].localeCompare(b[0]));
  const card = ([k, g]) => `
    <div class="card">
      <div class="t">${esc(k)}</div>
      <div class="n">${g.free} <small>/ ${g.total} 남음</small></div>
      <div class="s">노드 ${g.nodes}개${g.down ? ` · 사용 불가 ${g.down}` : ''}</div>
      <div class="bar"><i style="width:${g.used / g.total * 100}%;background:var(--used)"></i><i style="width:${g.free / g.total * 100}%;background:var(--free)"></i><i style="width:${g.down / g.total * 100}%;background:var(--down)"></i></div>
    </div>`;
  const main = rows.filter(r => rank(r[0]) < 3), rest = rows.filter(r => rank(r[0]) === 3);
  $('types').innerHTML = main.map(card).join('');
  $('otherTypes').innerHTML = rest.map(card).join('');
  $('otherSum').textContent = `다른 GPU ${rest.length}종 · ${rest.reduce((s, r) => s + r[1].free, 0)}개 남음`;
  const sel = $('nodeType'), cur = sel.value;
  sel.innerHTML = '<option value="">모든 GPU</option>' + rows.map(([k]) => `<option>${esc(k)}</option>`).join('');
  sel.value = cur;
}

function nodeUsers(){
  const m = {};
  for (const j of snap.jobs){
    if (j[4] !== 'R' || !j[5]) continue;
    const nds = expand(j[6]);
    for (const nd of nds){ const u = m[nd] ||= {}; u[j[1]] = (u[j[1]] || 0) + j[5] / nds.length; }
  }
  return m;
}
// n[1,3-5],n10 → [n1,n3,n4,n5,n10]
function expand(list){
  const out = [];
  for (const part of list.match(/[^,\[]+(\[[^\]]*\])?/g) || []){
    const m = part.match(/^(.*)\[(.*)\]$/);
    if (!m){ out.push(part); continue; }
    for (const r of m[2].split(',')){
      const [a, b] = r.split('-');
      if (b === undefined){ out.push(m[1] + a); continue; }
      for (let i = +a; i <= +b; i++) out.push(m[1] + String(i).padStart(a.length, '0'));
    }
  }
  return out;
}

function gpuDots(n){
  const u = Math.min(n.alloc, n.total);
  return '<span class="gpus">' + Array.from({length:n.total}, (_, i) =>
    `<b class="${!usable(n) ? 'd' : i < u ? 'u' : ''}"></b>`).join('') + '</span>';
}

function renderNodes(){
  const type = $('nodeType').value, onlyFree = $('onlyFree').checked, users = nodeUsers();
  const rows = snap.nodes
    .filter(n => (!type || n.gpu === type) && (!onlyFree || freeOf(n) > 0))
    .sort((a, b) => freeOf(b) - freeOf(a) || a.name.localeCompare(b.name, undefined, {numeric:true}));
  $('nodes').innerHTML = '<thead><tr><th>노드</th><th>GPU</th><th>사용</th><th>남음</th><th>CPU</th><th>상태</th><th>사용자 (GPU 수)</th></tr></thead><tbody>' +
    rows.map(n => {
      const us = Object.entries(users[n.name] || {}).sort((a, b) => b[1] - a[1]);
      return `<tr class="${us.some(([u]) => u === ME) ? 'me' : ''}">
        <td class="mono">${esc(n.name)}</td><td>${esc(n.gpu)}</td><td>${gpuDots(n)}</td>
        <td>${freeOf(n)}</td><td>${n.cpu[0]}/${n.cpu[1]}</td>
        <td title="${esc(n.reason)}">${esc(n.state.toLowerCase())}</td>
        <td>${us.map(([u, c]) => `${esc(u)} (${c})`).join(', ')}</td></tr>`;
    }).join('') + '</tbody>';
}

const JOB_HEAD = '<thead><tr><th>ID</th><th>사용자</th><th>이름</th><th>파티션</th><th>상태</th><th>GPU</th><th>노드 / 대기 사유</th><th>경과</th><th>제한</th></tr></thead>';
const jobRow = j => `<tr class="${j[1] === ME ? 'me' : ''}">
  <td class="mono">${esc(j[0])}</td><td>${esc(j[1])}</td><td>${esc(j[2])}</td><td>${esc(j[3])}</td>
  <td>${j[4] === 'R' ? '실행' : j[4] === 'P' ? '대기' : esc(j[4])}</td><td>${j[5] || ''}</td>
  <td class="mono">${esc(j[4] === 'R' ? j[6] : j[9])}</td><td>${esc(j[7])}</td><td>${esc(j[8])}</td></tr>`;

function renderMine(){
  const mine = snap.jobs.filter(j => j[1] === ME);
  $('mine').innerHTML = JOB_HEAD + '<tbody>' + (mine.length ? mine.map(jobRow).join('')
    : '<tr><td colspan="9" class="hint">돌고 있는 잡 없음</td></tr>') + '</tbody>';
}

const LIMIT = 300;
function renderJobs(){
  const q = $('q').value.trim().toLowerCase(), st = $('jstate').value;
  const rows = snap.jobs.filter(j => (!st || j[4] === st) &&
    (!q || [j[1], j[2], j[3], j[6]].some(v => v.toLowerCase().includes(q))));
  $('jobs').innerHTML = JOB_HEAD + '<tbody>' + rows.slice(0, LIMIT).map(jobRow).join('') + '</tbody>';
  const r = snap.jobs.filter(j => j[4] === 'R').length;
  $('jobsMore').textContent = `실행 ${r} · 대기 ${snap.jobs.length - r}` +
    (rows.length > LIMIT ? ` · 검색 결과 ${rows.length}개 중 ${LIMIT}개 표시` : '');
}

function render(){ renderStamp(); renderTypes(); renderMine(); renderNodes(); renderJobs(); }

async function refresh(){
  try{ snap = await load(); render(); }
  catch(e){ if (snap) renderStamp(); else $('stamp').textContent = '데이터를 불러오지 못했습니다'; console.warn(e); }
}

for (const id of ['nodeType', 'onlyFree']) $(id).onchange = renderNodes;
$('q').oninput = renderJobs; $('jstate').onchange = renderJobs;
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
refresh();
setInterval(refresh, 120000);
setInterval(renderStamp, 30000);
</script>
</body>
</html>
